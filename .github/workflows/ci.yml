name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests, Coverage and Mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Verify six intentional faults are detected
        run: npm run test:mutations
      - name: Upload coverage and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            evidence/zk2/
          if-no-files-found: error

  frontend:
    needs: unit-tests
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

  backend:
    needs: unit-tests
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpq-dev

      - name: Configure CMake
        run: |
          cd backend
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Server
        run: |
          cd backend
          cmake --build build --config Release
