name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Add coverage to job summary
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  frontend:
    needs: unit-tests
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

  backend:
    needs: unit-tests
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpq-dev

      - name: Configure CMake
        run: |
          cd backend
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Server
        run: |
          cd backend
          cmake --build build --config Release

  functional-e2e:
    needs: unit-tests
    name: Functional E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Install Chromium and System Dependencies
        run: npx playwright install --with-deps chromium
      - name: Start C++ API and PostgreSQL
        run: docker compose -f tests/e2e/compose.yml up --build --wait --wait-timeout 120
      - name: Run Functional E2E Tests
        run: npm run test:e2e
      - name: Collect Backend Logs
        if: failure()
        run: |
          mkdir -p artifacts/e2e
          docker compose -f tests/e2e/compose.yml logs --no-color > artifacts/e2e/backend.txt 2>&1
      - name: Upload E2E Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-e2e-reports
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop Test Services
        if: always()
        run: docker compose -f tests/e2e/compose.yml down
