name: zk-performance
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vprasalnik
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-local-performance-only
    volumes:
      - performance-data:/var/lib/postgresql/data
      - ../../vprasalnik.sql:/docker-entrypoint-initdb.d/vprasalnik.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vprasalnik"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:18082:3002"
    environment:
      PORT: 3002
      JWT_SECRET: synthetic-local-performance-secret
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:synthetic-local-performance-only@db:5432/vprasalnik
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  performance-data:
